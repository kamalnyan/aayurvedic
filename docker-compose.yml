services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: vedamrit_db
      MYSQL_USER: vedamrit_user
      MYSQL_PASSWORD: vedamrit_password
      MYSQL_ROOT_PASSWORD: vedamrit_root_password
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: vedamrit_user
      WORDPRESS_DB_PASSWORD: vedamrit_password
      WORDPRESS_DB_NAME: vedamrit_db
    volumes:
      - ./wp-content/themes/vedamrit:/var/www/html/wp-content/themes/vedamrit

volumes:
  db_data:
